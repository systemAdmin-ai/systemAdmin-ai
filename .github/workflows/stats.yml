name: Refresh stats cards

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/gen_stats.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate assets/stats.svg and assets/langs.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_stats.py

      - name: Commit if the numbers changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/; then
            echo "no changes"
          else
            git add assets/stats.svg assets/langs.svg
            git commit -m "chore: refresh stats cards"
            git push
          fi
