<svg width="720" height="46" viewBox="0 0 720 46" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="what I do">
  <title>macOS apps in Swift and SwiftUI</title>
  <defs>
    <style>
      .grow0 { transform-origin: 0 0; animation: t0 16s steps(28, end) infinite; }
      @keyframes t0 { 0% { transform: scaleX(0); } 23% { transform: scaleX(1); } 25% { transform: scaleX(0); } 100% { transform: scaleX(0); } }
      .grow1 { transform-origin: 0 0; animation: t1 16s steps(28, end) infinite; }
      @keyframes t1 { 0% { transform: scaleX(0); } 23% { transform: scaleX(1); } 25% { transform: scaleX(0); } 100% { transform: scaleX(0); } }
      .grow2 { transform-origin: 0 0; animation: t2 16s steps(28, end) infinite; }
      @keyframes t2 { 0% { transform: scaleX(0); } 23% { transform: scaleX(1); } 25% { transform: scaleX(0); } 100% { transform: scaleX(0); } }
      .grow3 { transform-origin: 0 0; animation: t3 16s steps(28, end) infinite; }
      @keyframes t3 { 0% { transform: scaleX(0); } 23% { transform: scaleX(1); } 25% { transform: scaleX(0); } 100% { transform: scaleX(0); } }
      .grow0 { animation-delay: -0s; }
      .grow1 { animation-delay: -4s; }
      .grow2 { animation-delay: -8s; }
      .grow3 { animation-delay: -12s; }
      @media (prefers-reduced-motion: reduce) {
        .grow0, .grow1, .grow2, .grow3 { animation: none; transform: scaleX(1); }
      }
    </style>

      <clipPath id="tc0"><rect class="grow0" x="0" y="0" width="720" height="46"/></clipPath>
      <clipPath id="tc1"><rect class="grow1" x="0" y="0" width="720" height="46"/></clipPath>
      <clipPath id="tc2"><rect class="grow2" x="0" y="0" width="720" height="46"/></clipPath>
      <clipPath id="tc3"><rect class="grow3" x="0" y="0" width="720" height="46"/></clipPath>
  </defs>
  <path d="M14 17 L22 24 L14 31" stroke="#63E6D2" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

    <g clip-path="url(#tc0)">
      <text x="34" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#CFDCF2">macOS apps in Swift and SwiftUI</text>
      <rect x="389.6" y="12" width="11" height="22" rx="2.5" fill="#63E6D2"/>
    </g>
    <g clip-path="url(#tc1)">
      <text x="34" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#CFDCF2">building the notch control center</text>
      <rect x="412.8" y="12" width="11" height="22" rx="2.5" fill="#63E6D2"/>
    </g>
    <g clip-path="url(#tc2)">
      <text x="34" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#CFDCF2">shipping it in the open</text>
      <rect x="296.8" y="12" width="11" height="22" rx="2.5" fill="#63E6D2"/>
    </g>
    <g clip-path="url(#tc3)">
      <text x="34" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#CFDCF2">finding cheaper CS2 skins</text>
      <rect x="320.0" y="12" width="11" height="22" rx="2.5" fill="#63E6D2"/>
    </g>
</svg>
