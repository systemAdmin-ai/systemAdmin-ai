<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="systemAdmin-ai — macOS apps, Swift, open source">
  <title>systemAdmin-ai — macOS apps, Swift, open source</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080a10"/>
      <stop offset="0.5" stop-color="#0c1220"/>
      <stop offset="1" stop-color="#080a10"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ddc97"/>
      <stop offset="0.5" stop-color="#63e6d2"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#63e6d2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#63e6d2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 96) scale(420 150)">
      <stop stop-color="#63e6d2" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#3ddc97" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#16203a" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="frame">
      <rect x="1" y="1" width="1278" height="358" rx="26"/>
    </clipPath>
    <style>
      .pulse { animation: pulse 5.5s ease-in-out infinite; }
      .pulse2 { animation: pulse 5.5s ease-in-out infinite 1.2s; }
      @keyframes pulse {
        0%, 100% { opacity: 0.45; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.06); }
      }
      .dash { stroke-dasharray: 220 900; animation: dash 6s linear infinite; }
      @keyframes dash {
        0% { stroke-dashoffset: 1120; }
        100% { stroke-dashoffset: 0; }
      }
      .shine { animation: shine 6s ease-in-out infinite; }
      @keyframes shine {
        0% { transform: translateX(-460px); opacity: 0; }
        12% { opacity: 1; }
        55% { transform: translateX(1000px); opacity: 0; }
        100% { transform: translateX(1000px); opacity: 0; }
      }
      .cursor { animation: blink 1.1s step-end infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .float { animation: float 7s ease-in-out infinite; }
      .float2 { animation: float 8.5s ease-in-out infinite 0.8s; }
      .float3 { animation: float 9.5s ease-in-out infinite 1.6s; }
      @keyframes float {
        0%, 100% { transform: translateY(0); opacity: 0.35; }
        50% { transform: translateY(-14px); opacity: 0.9; }
      }
      .wave { animation: wave 9s ease-in-out infinite; }
      @keyframes wave {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(-40px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .pulse2, .dash, .shine, .cursor, .float, .float2, .float3, .wave { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#grid)" opacity="0.55"/>
    <ellipse class="pulse" cx="640" cy="86" rx="430" ry="150" fill="url(#halo)"/>

    <g class="wave" opacity="0.5">
      <path d="M-40 300 C 180 250, 360 350, 620 300 C 880 250, 1080 330, 1320 286" stroke="url(#neon)" stroke-width="1.4" fill="none" opacity="0.55"/>
      <path d="M-40 322 C 200 276, 400 366, 660 318 C 920 270, 1120 348, 1320 306" stroke="url(#neon)" stroke-width="1" fill="none" opacity="0.3"/>
    </g>

    <g class="float"><circle cx="188" cy="126" r="2.6" fill="#63e6d2"/></g>
    <g class="float2"><circle cx="1092" cy="96" r="2" fill="#7c5cff"/></g>
    <g class="float3"><circle cx="980" cy="228" r="2.4" fill="#3ddc97"/></g>
    <g class="float2"><circle cx="268" cy="236" r="1.8" fill="#63e6d2"/></g>
    <g class="float"><circle cx="820" cy="72" r="1.6" fill="#63e6d2"/></g>

    <g transform="translate(640 52)">
      <rect x="-96" y="0" width="192" height="34" rx="17" fill="#05070c" stroke="#1d2a44" stroke-width="1.2"/>
      <rect class="dash" x="-96" y="0" width="192" height="34" rx="17" fill="none" stroke="url(#neon)" stroke-width="1.6" opacity="0.9"/>
      <circle cx="-70" cy="17" r="3.4" fill="#3ddc97"/>
      <text x="-58" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2.4" fill="#8ea3c4">NOTCH · MACOS · SWIFT</text>
    </g>

    <g transform="translate(640 176)">
      <text x="0" y="0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="62" font-weight="700" letter-spacing="-1.2" fill="url(#neon)">systemAdmin-ai</text>
      <g class="shine"><text x="0" y="0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="62" font-weight="700" letter-spacing="-1.2" fill="url(#shine)">systemAdmin-ai</text></g>
    </g>

    <g transform="translate(640 226)">
      <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#9fb2d0">I build native macOS apps for the notch — and tools that find cheaper CS2 skins</text>
    </g>

    <g transform="translate(640 268)" opacity="0.85">
      <rect x="-40" y="-16" width="80" height="50" rx="7" fill="none" stroke="#2a3a5c" stroke-width="1.4"/>
      <path d="M-14 -16 h28 a6 6 0 0 1 6 6 v2 h-40 v-2 a6 6 0 0 1 6 -6 z" fill="#05070c" stroke="#63e6d2" stroke-width="1.3"/>
      <circle class="pulse2" cx="0" cy="4" r="2" fill="#63e6d2"/>
    </g>

    <g opacity="0.9">
      <rect x="1" y="1" width="1278" height="358" rx="26" fill="none" stroke="#1b2740" stroke-width="1.4"/>
      <rect x="1" y="1" width="1278" height="358" rx="26" fill="none" stroke="url(#neon)" stroke-width="1.2" opacity="0.35"/>
    </g>
  </g>
</svg>
