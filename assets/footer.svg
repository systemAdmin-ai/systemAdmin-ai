<svg width="1280" height="150" viewBox="0 0 1280 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Footer">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1280" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080a10"/><stop offset="0.5" stop-color="#0b1020"/><stop offset="1" stop-color="#080a10"/>
    </linearGradient>
    <linearGradient id="fneon" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ddc97"/><stop offset="0.5" stop-color="#63e6d2"/><stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <clipPath id="fclip"><rect x="1" y="1" width="1278" height="148" rx="20"/></clipPath>
    <style>
      .w1 { animation: w1 11s ease-in-out infinite; }
      .w2 { animation: w2 14s ease-in-out infinite; }
      @keyframes w1 { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-36px); } }
      @keyframes w2 { 0%,100% { transform: translateX(0); } 50% { transform: translateX(28px); } }
      .glow { animation: glow 5s ease-in-out infinite; }
      @keyframes glow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .w1,.w2,.glow { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#fclip)">
    <rect width="1280" height="150" fill="url(#fbg)"/>
    <g class="w1" opacity="0.45">
      <path d="M-40 122 C 200 92, 420 148, 660 118 C 900 88, 1100 140, 1320 112" stroke="url(#fneon)" stroke-width="1.3" fill="none"/>
    </g>
    <g class="w2" opacity="0.25">
      <path d="M-40 140 C 220 110, 460 156, 700 128 C 940 100, 1140 150, 1320 124" stroke="url(#fneon)" stroke-width="1" fill="none"/>
    </g>

    <g transform="translate(48 50)">
      <circle class="glow" cx="0" cy="0" r="5" fill="#3ddc97"/>
      <text x="22" y="6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#dbe7fa">systemAdmin-ai</text>
      <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#7f93b4">Native macOS apps · Swift &amp; SwiftUI · open source</text>
    </g>

    <g transform="translate(1232 52)" text-anchor="end">
      <text x="0" y="0" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#8ea3c4">NotchDeck · SkinRadar</text>
      <text x="0" y="26" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#5f7392">hand-built on a MacBook Air M4</text>
    </g>

    <rect x="1" y="1" width="1278" height="148" rx="20" fill="none" stroke="#1b2740" stroke-width="1.3"/>
    <rect x="1" y="1" width="1278" height="148" rx="20" fill="none" stroke="url(#fneon)" stroke-width="1.2" opacity="0.3"/>
  </g>
</svg>
