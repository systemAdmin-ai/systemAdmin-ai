<svg width="620" height="330" viewBox="0 0 620 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SkinRadar — cheaper CS2 skins across marketplaces, in development">
  <title>SkinRadar — cheaper CS2 skins across marketplaces, in development</title>
  <defs>
    <linearGradient id="c2bg" x1="0" y1="0" x2="620" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0a18"/><stop offset="1" stop-color="#08070f"/>
    </linearGradient>
    <linearGradient id="c2neon" x1="0" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cff"/><stop offset="0.55" stop-color="#a78bfa"/><stop offset="1" stop-color="#63e6d2"/>
    </linearGradient>
    <radialGradient id="c2halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(310 40) scale(300 120)">
      <stop stop-color="#7c5cff" stop-opacity="0.28"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c2clip"><rect x="1" y="1" width="618" height="328" rx="22"/></clipPath>
    <style>
      .run2 { stroke-dasharray: 220 1500; animation: run2 8s linear infinite; }
      @keyframes run2 { 0% { stroke-dashoffset: 1720; } 100% { stroke-dashoffset: 0; } }
      .sweep { animation: sweep 4.5s linear infinite; transform-origin: 310px 60px; }
      @keyframes sweep { 0% { transform: rotate(0deg); opacity: 0.15; } 50% { opacity: 0.75; } 100% { transform: rotate(360deg); opacity: 0.15; } }
      .blink2 { animation: blink2 2s ease-in-out infinite; }
      @keyframes blink2 { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
      @media (prefers-reduced-motion: reduce) { .run2, .sweep, .blink2 { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#c2clip)">
    <rect width="620" height="330" fill="url(#c2bg)"/>
    <ellipse cx="310" cy="30" rx="300" ry="110" fill="url(#c2halo)"/>

    <g transform="translate(34 34)">
      <rect x="0" y="0" width="52" height="52" rx="14" fill="#120f24" stroke="#2a2350" stroke-width="1.2"/>
      <circle cx="26" cy="26" r="15" fill="none" stroke="#7c5cff" stroke-width="1.4" opacity="0.85"/>
      <circle cx="26" cy="26" r="8" fill="none" stroke="#a78bfa" stroke-width="1.2" opacity="0.7"/>
      <circle cx="26" cy="26" r="2.6" fill="#63e6d2"/>
      <path class="sweep" d="M26 26 L26 11 A15 15 0 0 1 39 19 Z" fill="#7c5cff" opacity="0.35"/>
    </g>

    <text x="102" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" font-weight="700" fill="#f0ecff">SkinRadar</text>
    <text x="102" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8f86b8">find cheaper CS2 skins across marketplaces</text>

    <g transform="translate(34 108)">
      <rect x="0" y="0" width="152" height="26" rx="13" fill="#1a1230" stroke="#4b3a8a" stroke-width="1"/>
      <circle class="blink2" cx="15" cy="13" r="3.4" fill="#a78bfa"/>
      <text x="26" y="18" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#c4b5fd">in development</text>
    </g>
    <g transform="translate(194 108)">
      <rect x="0" y="0" width="122" height="26" rx="13" fill="#120f24" stroke="#2a2350" stroke-width="1"/>
      <text x="14" y="18" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#a79fc8">5 marketplaces</text>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#b6aed6">
      <text x="34" y="172">› one search across five CS2 marketplaces</text>
      <text x="34" y="198">› price spread, fees and the cheapest listing</text>
      <text x="34" y="224">› Steam password is never requested — hashed only</text>
    </g>

    <g transform="translate(34 252)">
      <rect x="0" y="0" width="164" height="34" rx="9" fill="#171033" stroke="#4a3a85" stroke-width="1"/>
      <text x="14" y="22" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#c4b5fd">open the web app</text>
    </g>
    <g transform="translate(208 252)">
      <rect x="0" y="0" width="118" height="34" rx="9" fill="#0e0c1c" stroke="#2a2350" stroke-width="1"/>
      <text x="14" y="22" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#9a91c2">Cloudflare API</text>
    </g>

    <text x="586" y="276" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#6d6591">early preview</text>

    <rect x="1" y="1" width="618" height="328" rx="22" fill="none" stroke="#241f42" stroke-width="1.3"/>
    <rect class="run2" x="1" y="1" width="618" height="328" rx="22" fill="none" stroke="url(#c2neon)" stroke-width="1.6"/>
  </g>
</svg>
