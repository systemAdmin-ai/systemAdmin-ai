<svg width="620" height="330" viewBox="0 0 620 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub stats for systemAdmin-ai">
  <title>GitHub stats for systemAdmin-ai</title>
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="620" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0f18"/><stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="sneon" x1="0" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ddc97"/><stop offset="0.5" stop-color="#63e6d2"/><stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <clipPath id="sclip"><rect x="1" y="1" width="618" height="328" rx="22"/></clipPath>
    <style>
      @keyframes fade { from { opacity:0; } to { opacity:1; } }
      .run { stroke-dasharray:280 1500; animation:run 7.5s linear infinite; }
      @keyframes run { 0% { stroke-dashoffset:1780; } 100% { stroke-dashoffset:0; } }
      .dot { animation:dot 2.6s ease-in-out infinite; }
      @keyframes dot { 0%,100% { opacity:1; } 50% { opacity:.3; } }
      @media (prefers-reduced-motion: reduce) { .run,.dot { animation:none; } }
    </style>
  </defs>
  <g clip-path="url(#sclip)">
    <rect width="620" height="330" fill="url(#sbg)"/>
    <text x="34" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.6" fill="#6d7f9c">BY THE NUMBERS</text>
    <circle class="dot" cx="586" cy="47" r="3.4" fill="#3ddc97"/>
    <text x="34" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#e8f1ff">Building in public, one release at a time</text>
    <text x="34" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#6d7f9c">auto-updated from the GitHub API · systemAdmin-ai</text>
    
    <g transform="translate(34 128)"><g style="animation:fade .9s ease forwards 0.12s">
      <rect x="0" y="0" width="168" height="72" rx="14" fill="#0c1422" stroke="#1a2438" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="72" rx="2" fill="#63e6d2" opacity="0.85"/>
      <text x="20" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.4" fill="#6d7f9c">PUBLIC REPOS</text>
      <text x="20" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#e8f1ff">17</text>
    </g></g>
    <g transform="translate(224 128)"><g style="animation:fade .9s ease forwards 0.22s">
      <rect x="0" y="0" width="168" height="72" rx="14" fill="#0c1422" stroke="#1a2438" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="72" rx="2" fill="#3ddc97" opacity="0.85"/>
      <text x="20" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.4" fill="#6d7f9c">STARS EARNED</text>
      <text x="20" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#e8f1ff">8</text>
    </g></g>
    <g transform="translate(414 128)"><g style="animation:fade .9s ease forwards 0.32s">
      <rect x="0" y="0" width="168" height="72" rx="14" fill="#0c1422" stroke="#1a2438" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="72" rx="2" fill="#7c5cff" opacity="0.85"/>
      <text x="20" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.4" fill="#6d7f9c">COMMITS · 12 MO</text>
      <text x="20" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#e8f1ff">41</text>
    </g></g>
    <g transform="translate(34 220)"><g style="animation:fade .9s ease forwards 0.42s">
      <rect x="0" y="0" width="168" height="72" rx="14" fill="#0c1422" stroke="#1a2438" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="72" rx="2" fill="#63e6d2" opacity="0.85"/>
      <text x="20" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.4" fill="#6d7f9c">PULL REQUESTS</text>
      <text x="20" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#e8f1ff">11</text>
    </g></g>
    <g transform="translate(224 220)"><g style="animation:fade .9s ease forwards 0.52s">
      <rect x="0" y="0" width="168" height="72" rx="14" fill="#0c1422" stroke="#1a2438" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="72" rx="2" fill="#3ddc97" opacity="0.85"/>
      <text x="20" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.4" fill="#6d7f9c">REPOS TOUCHED</text>
      <text x="20" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#e8f1ff">6</text>
    </g></g>
    <g transform="translate(414 220)"><g style="animation:fade .9s ease forwards 0.62s">
      <rect x="0" y="0" width="168" height="72" rx="14" fill="#0c1422" stroke="#1a2438" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="72" rx="2" fill="#7c5cff" opacity="0.85"/>
      <text x="20" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.4" fill="#6d7f9c">FOLLOWERS</text>
      <text x="20" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#e8f1ff">1</text>
    </g></g>
    <rect x="1" y="1" width="618" height="328" rx="22" fill="none" stroke="#1b2740" stroke-width="1.3"/>
    <rect class="run" x="1" y="1" width="618" height="328" rx="22" fill="none" stroke="url(#sneon)" stroke-width="1.6"/>
  </g>
</svg>
